# Minimal Configuration
# Smallest possible setup for testing or very light workloads

appspace:
  elastic:
    name: "minimal-elastic"
    version: "8.15.1"
    
    podDisruptionBudget:
      enabled: false
    
    nodeSets:
      - name: default
        count: 1
        config:
          node.roles: ["master", "data", "ingest"]
          xpack.security.enabled: true
          xpack.security.transport.ssl.enabled: true
          xpack.security.http.ssl.enabled: true
        podTemplate:
          spec:
            containers:
              - name: elasticsearch
                resources:
                  requests:
                    memory: "1Gi"
                    cpu: "500m"
                  limits:
                    memory: "1Gi"
                    cpu: "1000m"
                env:
                  - name: ES_JAVA_OPTS
                    value: "-Xms512m -Xmx512m"
            initContainers:
              - name: sysctl
                securityContext:
                  privileged: true
                  runAsUser: 0
                command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
        volumeClaimTemplates:
          - metadata:
              name: elasticsearch-data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
    
    http:
      tls:
        enabled: true
      service:
        spec:
          type: ClusterIP
    
    monitoring:
      enabled: false
