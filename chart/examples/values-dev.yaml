# Development Environment Configuration
# Single-node cluster with minimal resources for local development

appspace:
  elastic:
    name: "dev-elastic"
    version: "8.15.1"
    
    # Disable PDB for single-node setup
    podDisruptionBudget:
      enabled: false
    
    nodeSets:
      # Single all-in-one node
      - name: all-in-one
        count: 1
        config:
          node.roles: ["master", "data", "ingest"]
          xpack.security.enabled: true
          xpack.security.transport.ssl.enabled: true
          xpack.security.http.ssl.enabled: true
        podTemplate:
          metadata:
            labels:
              role: all-in-one
          spec:
            containers:
              - name: elasticsearch
                resources:
                  requests:
                    memory: "2Gi"
                    cpu: "500m"
                  limits:
                    memory: "2Gi"
                    cpu: "1000m"
                env:
                  - name: ES_JAVA_OPTS
                    value: "-Xms1g -Xmx1g"
            initContainers:
              - name: sysctl
                securityContext:
                  privileged: true
                  runAsUser: 0
                command: ['sh', '-c', 'sysctl -w vm.max_map_count=262144']
        volumeClaimTemplates:
          - metadata:
              name: elasticsearch-data
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
              storageClassName: standard
    
    # Use ClusterIP for local access
    http:
      tls:
        enabled: true
      service:
        metadata:
          labels:
            environment: development
        spec:
          type: ClusterIP
    
    # Disable monitoring for dev
    monitoring:
      enabled: false
